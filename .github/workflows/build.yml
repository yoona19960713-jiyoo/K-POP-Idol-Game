name: 打包 K-POP Idol Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 檢查簽章金鑰
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::還沒設定 KEYSTORE_B64 這個 Secret,請照說明把簽章金鑰貼進 Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 寫入版本號
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          PAGES="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          N=${{ github.run_number }}
          printf 'window.APP_VERSION = "1.0.%s";\nwindow.APP_BUILD = %s;\nwindow.PAGES_URL = "%s";\n' "$N" "$N" "$PAGES" > www/version.js
          jq -n --arg v "1.0.$N" --argjson b "$N" --arg n "${NOTES:-}" '{version:$v,build:$b,notes:$n}' > www/version.json
          cat www/version.js www/version.json

      - name: 安裝套件
        run: npm install --no-audit --no-fund

      - name: 建立 Android 專案
        run: |
          npx cap add android
          # 遊戲固定橫向、全螢幕
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -n screenOrientation android/app/src/main/AndroidManifest.xml
          # 沉浸式全螢幕:隱藏狀態列與導覽列(從邊緣滑動可暫時叫出),舞台才能用滿整個螢幕高度
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(grep -m1 '^package' "$MA")
          cat > "$MA" <<'JAVA'
          __PKG__
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                WindowManager.LayoutParams lp = getWindow().getAttributes();
                lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(lp);
              }
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              c.hide(WindowInsetsCompat.Type.systemBars());
              c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
            }
          }
          JAVA
          sed -i "s|^ *__PKG__|$PKG|; s|^          ||" "$MA"
          head -3 "$MA"
          # App 圖示:從 assets/ 產生(藝瑟的緋紅搖籃曲特寫)
          npx --yes @capacitor/assets@3 generate --android --assetPath assets || echo "::warning::圖示產生失敗,先用預設圖示"
          npx cap sync android

      - name: 打包 APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 簽章(每次都用同一把金鑰,更新時不用解除安裝)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-pass pass:kpopclothes --key-pass pass:kpopclothes --ks-key-alias clothes --out KPOP-Game.apk aligned.apk
          rm ks.jks

      - name: 發布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" KPOP-Game.apk \
            --title "K-POP Idol Game 1.0.${{ github.run_number }}" \
            --notes "自動產生的安裝檔"

      - name: 準備網頁版
        run: |
          cp KPOP-Game.apk www/KPOP-Game.apk
          touch www/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
